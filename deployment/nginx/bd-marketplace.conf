##
# BD Marketplace — restricted staging deployment (HTTP only)
#
# Serves the Laravel application from the backend public directory and lets
# the React single-page app handle client-side routing. Uploaded media is
# streamed by Laravel from storage/app/uploads (outside the document root).
#
# Port 80 is reserved for the Apache2 default page; this site listens on 8081.
# Keep APP_URL in backend/.env in sync: http://172.16.155.22:8081
#
# Install:
#   sudo cp deployment/nginx/bd-marketplace.conf /etc/nginx/sites-available/bd-marketplace
#   sudo ln -sf /etc/nginx/sites-available/bd-marketplace /etc/nginx/sites-enabled/bd-marketplace
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
##

server {
    listen 8081 default_server;
    listen [::]:8081 default_server;

    server_name 172.16.155.22 103.54.109.243 _;

    root /var/www/bd-marketplace/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12m;

    # Never leak framework or dot files.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Hashed Vite assets can be cached forever.
    location ^~ /app/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # The SPA shell must always be revalidated so deploys take effect.
    location = /app/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /app/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Front controller: API, media streaming, SPA fallback.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    # Uploaded media is streamed by Laravel from storage/app/uploads. This must
    # be a ^~ prefix location, otherwise the static-file regex below would
    # intercept image requests and return 404 instead of reaching the app.
    location ^~ /media/ {
        try_files $uri /index.php?$query_string;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Static files that are not part of the SPA (favicon, robots, etc.).
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot|css|js|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}
