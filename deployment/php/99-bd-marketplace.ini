; BD Marketplace PHP-FPM overrides.
; Drop-in for /etc/php/8.3/fpm/conf.d/99-bd-marketplace.ini
;
; The media service accepts 5 MB image uploads, so PHP must allow at least
; that plus multipart overhead.

upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 20
max_execution_time = 60
memory_limit = 256M

; Production opcache (Laravel caches configuration and routes at deploy time).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
